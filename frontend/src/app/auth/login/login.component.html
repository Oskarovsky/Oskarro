<div class="auth-wrap">
  <div class="auth-card">
      <h1 class="display" style="font-size: 2.4rem; margin: 12px 8px 0;">Zaloguj się</h1>
      <p class="lede" style="margin: 8px;">Wracasz do odsłuchu, komentarzy i własnych utworów.</p>
      <form
        *ngIf="!isLoggedIn"
        name="form"
        (ngSubmit)="f.form.valid && onSubmit()"
        #f="ngForm"
        novalidate>
        <div class="form-group">
          <label for="username">Nazwa użytkownika</label>
          <input
            type="text"
            class="form-control"
            name="username"
            [(ngModel)]="form.username"
            required
            #username="ngModel"/>
          <div
            class="alert alert-danger"
            role="alert"
            *ngIf="f.submitted && username.invalid">
            Wymagana nazwa użytkownika
          </div>
        </div>
        <div class="form-group">
          <label for="password">Hasło</label>
          <input
            type="password"
            class="form-control"
            name="password"
            [(ngModel)]="form.password"
            required
            minlength="6"
            #password="ngModel"/>
          <div
            class="alert alert-danger"
            role="alert"
            *ngIf="f.submitted && password.invalid">
            <div *ngIf="password.errors.required">Wymagane hasło</div>
            <div *ngIf="password.errors.minlength">
              Hasło musi zawierać minimum 6 znaków
            </div>
          </div>
        </div>
        <div class="form-group">
          <button class="btn btn-primary btn-block">
            Zaloguj się
          </button>
        </div>
        <div class="form-group">
          <div
            class="alert alert-danger"
            role="alert"
            *ngIf="f.submitted && isLoginFailed">
            Błąd logowania: {{ errorMessage }}
          </div>
        </div>
      </form>

      <div class="alert alert-success" *ngIf="isLoggedIn">
        Zalogowałeś się jako {{ roles }}.
      </div>
    </div>
</div>
