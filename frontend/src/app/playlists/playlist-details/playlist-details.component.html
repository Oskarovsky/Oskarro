<div class="page">

  <a class="back" routerLink="/playlist/all">← Playlisty</a>
  <p class="kicker">{{ playlist?.owner }}</p>
  <h1 class="display">{{ playlist?.name }}</h1>
  <p class="lede" *ngIf="playlist?.description">{{ playlist.description }}</p>
  <p *ngIf="!isLoggedIn"><a routerLink="/login">Zaloguj się</a>, żeby odtworzyć utwory.</p>


  <div class="col-md-9">
    <div class="row">
      <div class="col-md-12">
        <p *ngIf="this.tracks.length === 0">Nie ma żadnych utworów w tej składance</p>
      </div>
    </div>
  </div>

  <!-- Track list -->
  <table class="table table-striped">
    <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Artist</th>
      <th scope="col">Title</th>
      <th scope="col">Version</th>
    </tr>
    </thead>
    <tbody>
    <ng-container *ngFor="let track of tracks; index as i">
    <tr>
      <th scope="row">{{ i + 1 }}</th>
      <td>{{ track.artist }}</td>
      <td>{{ track.title }}</td>
      <td>{{ track.version }}</td>
    </tr>
    <tr *ngIf="showPlayer(track.url)">
      <td colspan="4"><app-track-player [url]="track.url"></app-track-player></td>
    </tr>
    </ng-container>
    </tbody>
  </table>

  <a class="btn-ghost" routerLink="../edit" *ngIf="canEdit">Edytuj</a>

</div>
