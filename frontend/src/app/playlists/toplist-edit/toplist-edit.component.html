<div class="page">
  <form name="form" #form="ngForm" (ngSubmit)="addTrackToRanking()" class="stack">
    <label>Tytuł
      <input type="text" [(ngModel)]="model.title" name="title">
    </label>
    <label>Wykonawca
      <input type="text" [(ngModel)]="model.artist" name="artist">
    </label>
    <label>Wersja
      <input type="text" [(ngModel)]="model.version" name="version">
    </label>
    <label>Link do pliku
      <input type="text" [(ngModel)]="model.url" name="url">
    </label>
    <label>Punkty
      <input type="number" [(ngModel)]="model.points" name="points">
    </label>
    <button class="btn-accent" type="submit">Dodaj utwór</button>
  </form>
</div>
