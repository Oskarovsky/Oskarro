<div class="container">

  <h3>Playlista: {{video.name}}</h3>

  <div class="col-md-9">
    <div class="row">
      <div class="col-md-12">
        <p *ngIf="this.tracks.length === 0">Nie ma żadnych utworów w tej składance</p>
      </div>
    </div>
  </div>


  <!-- Track list -->
  <table class="table table-striped">
    <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Artist</th>
      <th scope="col">Title</th>
      <th scope="col">Version</th>
      <th scope="col">hostuje.net</th>
      <th scope="col"></th>
    </tr>
    </thead>
    <tbody>
    <ng-container *ngFor="let track of tracks; index as i">
    <tr>
      <th scope="row">{{ i + 1 }}</th>
      <td><input type="text"
                 [(ngModel)]="track.artist"
                 (change)="updateTrack(track)"
                 class="input-label-lg"
                 maxlength="80" style="width: 100%"/></td>
      <td><input type="text"
                 [(ngModel)]="track.title"
                 (change)="updateTrack(track)"
                 class="input-label-lg"
                 maxlength="80" style="width: 100%"/></td>
      <td><input type="text"
                 [(ngModel)]="track.version"
                 (change)="updateTrack(track)"
                 class="input-label-lg"
                 maxlength="80" style="width: 100%"/></td>
      <td>
        <input type="text"
               [(ngModel)]="track.url"
               (change)="updateTrack(track)"
               placeholder="https://hostuje.net/file.php?id=..."
               style="width: 100%"/>
      </td>
      <td>
        <a (click)="deleteTrack(track.id)" class="pull-right text-danger">
          <span aria-label="Usuń" title="Usuń" style="float:right;cursor:pointer;">✕</span>
        </a>
      </td>
    </tr>
    <tr *ngIf="showPlayer(track.url)">
      <td colspan="6"><app-track-player [url]="track.url"></app-track-player></td>
    </tr>
    </ng-container>
    </tbody>
  </table>

  <!-- ADDING TRACK TO PLAYLIST PANEL -->
  <div style="margin-top: 12px;">
    <input [(ngModel)]="draft.artist" type="text" placeholder="Wykonawca" maxlength="80" style="width: 24%; margin-right: 8px;"/>
    <input [(ngModel)]="draft.title" type="text" placeholder="Tytuł" maxlength="80" style="width: 24%; margin-right: 8px;"/>
    <input [(ngModel)]="draft.version" type="text" placeholder="Wersja" maxlength="80" style="width: 20%; margin-right: 8px;"/>
    <input [(ngModel)]="draft.url" type="text" placeholder="Link hostuje.net" style="width: 28%;"/>
    <button class="btn-accent"
            (click)="addTrackToVideo()"
            type="button"
            color="primary"
            style="margin-left: 10px; margin-top: 8px;">Dodaj utwór
    </button>
  </div>


  <button type="button"
          class="btn btn-warning pull-right"
          routerLink="../details"
          style="margin-left: 10px;">Zapisz playlistę
  </button>
</div>
