<div class="page">
  <form name="form" #form="ngForm" class="stack" (ngSubmit)="createVideo(videoName.value, videoCategory.value, videoUrl.value)">
    <label>Nazwa
      <input #videoName type="text" [(ngModel)]="modelVideo.name" name="name">
    </label>
    <label>Kategoria
      <select #videoCategory [(ngModel)]="modelVideo.category" name="category">
        <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
      </select>
    </label>
    <label>URL
      <input #videoUrl type="text" [(ngModel)]="modelVideo.url" name="url">
    </label>
    <button class="btn-accent" type="button"
            (click)="createVideo(videoName.value, videoCategory.value, videoUrl.value)"
            routerLink="/video">Dodaj video</button>
  </form>
</div>
