<div class="page">
  <p class="kicker">Kanał Oskarro</p>
  <div class="section-head">
    <h1 class="display">Sety</h1>
    <a class="btn-ghost" href="https://www.youtube.com/@Oskarro0" target="_blank" rel="noopener">Kanał na YouTube</a>
  </div>
  <p class="lede">Wszystkie sety z kanału Oskarro. Mixy na imprezę, do auta i na parkiet.</p>

  <div class="set-grid" *ngIf="videos.length">
    <a class="set-card" *ngFor="let video of videos" [routerLink]="['/video/set', video.id]">
      <span class="thumb">
        <img [src]="thumb(video.id)" [alt]="video.title">
        <em *ngIf="video.duration">{{ video.duration }}</em>
      </span>
      <span class="copy">
        <strong>{{ video.title }}</strong>
        <small *ngIf="video.published">{{ video.published }}</small>
      </span>
    </a>
  </div>
  <p class="lede" *ngIf="failed">Sety chwilowo się nie ładują. Zajrzyj prosto na <a href="https://www.youtube.com/@Oskarro0" target="_blank" rel="noopener">kanał Oskarro</a>.</p>
</div>
