<div class="page">
  <a class="back" routerLink="/video">← Sety</a>
  <p class="kicker">Set Oskarro</p>
  <h1 class="display">{{ title }}</h1>
  <p class="lede" *ngIf="published">{{ published }}</p>
  <div class="stage" *ngIf="embed">
    <iframe [src]="embed" [title]="title" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>
  <p><a [href]="watch" target="_blank" rel="noopener">Otwórz na YouTube</a></p>
</div>
