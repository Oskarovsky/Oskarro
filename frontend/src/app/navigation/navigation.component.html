<header class="topbar">
  <a class="brand" routerLink="/" (click)="menuOpen = false">
    <img class="logo" src="assets/logo-mark.png" alt="">
    Oskarro
  </a>
  <form class="nav-find" (submit)="$event.preventDefault(); onSearch($event)">
    <input [(ngModel)]="search.text" name="q" type="search" placeholder="Szukaj utworu" autocomplete="off">
    <button class="btn-accent" type="submit">OK</button>
  </form>
  <button class="nav-toggle" type="button" (click)="menuOpen = !menuOpen">Menu</button>
  <nav class="topnav" [class.open]="menuOpen">
    <a routerLink="/tracklist/club" routerLinkActive="is-on" (click)="menuOpen = false">Club</a>
    <a routerLink="/tracklist/dance" routerLinkActive="is-on" (click)="menuOpen = false">Dance</a>
    <a routerLink="/tracklist/house" routerLinkActive="is-on" (click)="menuOpen = false">House</a>
    <a routerLink="/tracklist/retro" routerLinkActive="is-on" (click)="menuOpen = false">Retro</a>
    <a routerLink="/video" routerLinkActive="is-on" (click)="menuOpen = false">Wideo</a>
    <a routerLink="/playlist/all" routerLinkActive="is-on" (click)="menuOpen = false">Playlisty</a>
    <a routerLink="/ranking" routerLinkActive="is-on" (click)="menuOpen = false">Ranking</a>
    <span class="nav-space"></span>
    <span class="account">
      <a *ngIf="showAdminBoard" routerLink="/admin" (click)="menuOpen = false">Admin</a>
      <a class="btn-accent" routerLink="/track/add" (click)="menuOpen = false">Dodaj utwór</a>
      <a *ngIf="!isLoggedIn" routerLink="/login" (click)="menuOpen = false">Zaloguj się</a>
      <a *ngIf="!isLoggedIn" routerLink="/register" (click)="menuOpen = false">Dołącz</a>
      <a *ngIf="isLoggedIn" routerLink="/profile" (click)="menuOpen = false">{{ username }}</a>
      <a *ngIf="isLoggedIn && username" routerLink="/playlist/all/{{username}}" (click)="menuOpen = false">Moje składanki</a>
      <button *ngIf="isLoggedIn" class="btn-ghost" type="button" (click)="logout()">Wyloguj się</button>
    </span>
  </nav>
</header>
