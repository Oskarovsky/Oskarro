# Never commit the real value. Production sets it in /opt/oskarro/application.yml.
oskarro.app.jwtSecret=${JWT_SECRET}
oskarro.app.jwtExpiration=86400

logging.level.org.springframework.web=INFO

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

server.port=8081

# Metrics for Prometheus/Grafana. The backend listens on 127.0.0.1 only and nginx proxies
# just /api/, so /actuator is reachable from the server itself, not from the internet.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=oskarro

# Behind nginx: trust X-Forwarded-* from 127.0.0.1 so OAuth2 redirect URIs use https://oskarro.com.
server.forward-headers-strategy=native

# Google/Facebook sign-in stays off until client ids are set (production: /opt/oskarro/application.yml).
# Facebook needs the email field requested explicitly.
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email
